name: .NET Core Build & Verify

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify Solution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Display .NET environment info
      run: dotnet --info

    - name: Restore dependencies
      run: dotnet restore SQLDatabaseScriptGenerator.csproj

    - name: Build project (Release Mode)
      run: dotnet build SQLDatabaseScriptGenerator.csproj --no-restore --configuration Release

    - name: Run Tests (if available)
      run: dotnet test SQLDatabaseScriptGenerator.csproj --no-build --verbosity normal --configuration Release || true
